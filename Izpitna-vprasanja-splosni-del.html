// ── localStorage helpers (persist progress on iPad) ──
function loadState(key, fallback) {
  try { const v = localStorage.getItem("izpit_" + key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function saveState(key, val) {
  try { localStorage.setItem("izpit_" + key, JSON.stringify(val)); } catch {}
}

  // ═══════════════════════════════════════════════════
  // 8. STANDARDI ZAPS
  // ═══════════════════════════════════════════════════
  {
    id: "st-zaps",
    title: "8. Standardi ZAPS",
    subtitle: "ST ZAPS 01–06: Arhitekturne in krajinskoarhitekturne storitve",
    icon: "📋",
    color: "#be185d",
    lawKey: null,
    questions: [
      { id: "stzaps-1", q: "Kaj je Standard ZAPS?", a: "Standard ZAPS (ST ZAPS) je strokovni akt, ki ga sprejme ZAPS in določa pravila za opravljanje arhitekturnih in krajinskoarhitekturnih storitev. Standardi opredeljujejo vsebino storitev, način vrednotenja, izdelavo projektne dokumentacije. Obsegajo: ST ZAPS 01 (Storitve), ST ZAPS 02 (Vrednotenje), ST ZAPS 03 (Vsebina A načrtov), ST ZAPS 04 (Izdelava A načrtov), ST ZAPS 05 (Vsebina KA načrtov), ST ZAPS 06 (Izdelava KA načrtov).", src: [{ law: "ST ZAPS", art: "01–06" }] },
      { id: "stzaps-2", q: "Ali je uporaba ST ZAPS obvezna?", a: "Uporaba ST ZAPS je obvezna za člane ZAPS (pooblaščene arhitekte in krajinske arhitekte). Obveznost izhaja iz ZAID in splošnih aktov ZAPS. Neupoštevanje standardov se obravnava v disciplinskem postopku. Za naročnike storitev standardi niso neposredno zavezujoči, a določajo minimalne vsebine storitev, ki jih mora arhitekt zagotoviti.", src: [{ law: "ZAID", art: "6. člen" }, { law: "ST ZAPS", art: "01" }] },
      { id: "stzaps-3", q: "V katerem delu je ST ZAPS obvezen?", a: "Obvezen je v delu, ki določa minimalne vsebine projektne dokumentacije in storitev, ki jih mora pooblaščeni arhitekt zagotoviti. Prostovoljni del so priporočila za nadstandardne storitve. Posebni del (splošni del izpita) zahteva poznavanje osnovnih vsebin vseh šestih standardov.", src: [{ law: "ST ZAPS", art: "01" }] },
      { id: "stzaps-4", q: "Kaj so pravila stroke?", a: "Pravila stroke so strokovna pravila in uzance, ki jih mora spoštovati vsak pooblaščeni strokovnjak. Obsegajo: standarde ZAPS, tehnične smernice, kodeks poklicne etike, Evrokode, SIST standarde in druga pravila, ki urejajo kakovost arhitekturnega projektiranja. Kršitev pravil stroke je podlaga za disciplinsko in odškodninsko odgovornost.", src: [{ law: "ZAID", art: "6. člen" }, { law: "ST ZAPS", art: "01" }] },
      { id: "stzaps-5", q: "Naštej faze v življenjskem ciklu objekta!", a: "Po ST ZAPS 01 so faze: (1) Zasnova — programska izhodišča, idejna zasnova; (2) Projektiranje — idejni projekt, DGD, PZI; (3) Izvedba — gradnja, nadzor; (4) Prevzem — tehnični pregled, uporabno dovoljenje; (5) Uporaba — obratovanje, vzdrževanje; (6) Prenova ali odstranitev. Vsaka faza ima definirane storitve in odgovornosti arhitekta.", src: [{ law: "ST ZAPS", art: "01, poglavje 3" }] },
      { id: "stzaps-6", q: "Kakšna je razlika med osnovnimi in posebnimi storitvami?", a: "Osnovne storitve so minimalni obseg storitev, ki jih arhitekt mora izvesti za posamezno fazo (npr. projektiranje DGD). Posebne storitve so dodatne storitve, ki presegajo osnovni obseg (npr. vizualizacije, svetovanje pri izbiri izvajalca, posebne študije). Posebne storitve se dogovorijo in obračunajo posebej. ST ZAPS 01 natančno našteva obe vrsti storitev po fazah.", src: [{ law: "ST ZAPS", art: "01, poglavje 4" }] },
      { id: "stzaps-7", q: "Naštej vrste objektov po ST ZAPS", a: "ST ZAPS razlikuje objekte po: (1) stavbe za prebivanje (enostanovanjske, večstanovanjske); (2) poslovne stavbe; (3) industrijske stavbe; (4) javne stavbe (izobraževanje, zdravstvo, kultura); (5) sakralne stavbe; (6) objekti za šport in rekreacijo; (7) kmetijski objekti; (8) odprti prostori (parki, trgi, krajina). Vrsta objekta vpliva na obseg storitev in vrednotenje.", src: [{ law: "ST ZAPS", art: "01, priloga" }] },
      { id: "stzaps-8", q: "Vrste projektiranja po ST ZAPS", a: "Vrste projektiranja: (1) arhitekturno projektiranje (za stavbe); (2) krajinskoarhitekturno projektiranje (za odprti prostor); (3) urbanistično načrtovanje (OPN, OPPN); (4) notranje oblikovanje (interier). Vsaka vrsta ima svoje specifične zahteve glede vsebine in obsega projektne dokumentacije.", src: [{ law: "ST ZAPS", art: "01" }] },
      { id: "stzaps-9", q: "Kaj je vodenje projektiranja?", a: "Vodenje projektiranja je koordinacija vseh udeležencev v procesu projektiranja (arhitekt, inženirji, specialisti). Vodja projektiranja (praviloma PA) je odgovoren za: usklajenost vseh načrtov, pravočasnost, kakovost projektne dokumentacije, komunikacijo z investitorjem in mnenjedajalci. Po GZ-1 je odgovorni vodja projekta tisti, ki podpiše vodilno mapo.", src: [{ law: "ST ZAPS", art: "01" }, { law: "GZ-1", art: "29. člen" }] },
      { id: "stzaps-10", q: "Katere storitve v skladu s ST ZAPS izvaja arhitekt oziroma krajinski arhitekt, kadar ni vodja projektiranja?", a: "Kadar ni vodja projektiranja, arhitekt izvaja storitve v okviru svojega načrta: izdelava arhitekturnega/KA načrta, uskladitev z drugimi načrti, zagotavljanje bistvenih zahtev v okviru svojega področja. Ne prevzema pa odgovornosti za usklajenost celotne projektne dokumentacije — to je naloga vodja projektiranja.", src: [{ law: "ST ZAPS", art: "01, poglavje 4.2" }] },
      { id: "stzaps-11", q: "Kaj pomeni osnovi BIM?", a: "BIM (Building Information Modeling) je digitalno modeliranje objekta, ki vključuje geometrijske in informacijske podatke o objektu skozi celoten življenjski cikel. Osnove BIM za arhitekta: 3D model z informacijami o materialih, količinah, fazah gradnje; koordinacija med disciplinami (clash detection); podlaga za PZI, popise in obračune. ST ZAPS upošteva BIM kot sodoben način projektiranja.", src: [{ law: "ST ZAPS", art: "04" }] },
      { id: "stzaps-12", q: "Razlika med gradbenim in projektantskim nadzorom?", a: "Gradbeni nadzor (po GZ-1): nadzornik preverja skladnost izvedbe s projektom in GD, kakovost materialov, bistvene zahteve. Projektantski nadzor (po ST ZAPS): projektant (arhitekt) preverja, ali se gradnja izvaja v skladu z njegovim projektom, svetuje pri izvedbenih detajlih. Gradbeni nadzor je zakonska obveznost, projektantski nadzor je pogodbena storitev.", src: [{ law: "GZ-1", art: "78.–83. člen" }, { law: "ST ZAPS", art: "01" }] },
      { id: "stzaps-13", q: "Kaj so skupni stroški?", a: "Skupni stroški so stroški, ki niso neposredno del projektiranja, a so potrebni za izvedbo projekta: potni stroški, tiskanje dokumentacije, geodetske storitve, geomehanske raziskave, upravne takse, pridobivanje mnenj. Po ST ZAPS 02 se skupni stroški obračunavajo posebej od honorarja za storitve.", src: [{ law: "ST ZAPS", art: "02" }] },
      { id: "stzaps-14", q: "Kaj so stroški gradnje?", a: "Stroški gradnje so celotni stroški izvedbe objekta — materiali, delo, oprema, gradbišče. So podlaga za izračun honorarja arhitekta po ST ZAPS 02 (vrednotenje storitev). Stroški gradnje se ocenijo v fazi zasnove in natančneje določijo v fazi PZI (popisi del). Ne vključujejo: stroškov zemljišča, komunalnega prispevka, davkov.", src: [{ law: "ST ZAPS", art: "02" }] },
      { id: "stzaps-15", q: "Kaj je ocena stroškov in kako se določi?", a: "Ocena stroškov je predračun predvidenih stroškov gradnje. Določi se na podlagi: (1) referenčnih cen na enoto (€/m² BTP); (2) popisov del in predizmere v fazi PZI; (3) primerjalnih podatkov (stroški primerljivih objektov). Natančnost ocene se povečuje z napredovanjem projektiranja: v idejni fazi ±20–30%, v PZI fazi ±10–15%.", src: [{ law: "ST ZAPS", art: "02" }] },
      { id: "stzaps-16", q: "Kaj je aproksimativni predračun?", a: "Aproksimativni predračun je okvirna ocena stroškov gradnje na podlagi površine objekta (BTP) in referenčne cene na m². Izdela se v zgodnjih fazah projektiranja (idejni projekt). Služi kot orientacija za investitorja pri odločitvi o nadaljevanju projekta. Natančnost: ±20–30% od dejanskih stroškov.", src: [{ law: "ST ZAPS", art: "02" }] },
      { id: "stzaps-17", q: "Kaj je popis del?", a: "Popis del je seznam vseh gradbenih, obrtniških in instalacijskih del s količinami, opisi in enotami mere. Je del PZI dokumentacije. Služi kot podlaga za: pridobivanje ponudb izvajalcev, sklenitev gradbene pogodbe, obračun izvedenih del. Popis mora biti natančen, pregleden in usklajen z načrti.", src: [{ law: "ST ZAPS", art: "01, 04" }] },
      { id: "stzaps-18", q: "Kaj je projektantski predračun?", a: "Projektantski predračun je predračun stroškov gradnje, ki ga izdela projektant na podlagi popisov del in trenutnih tržnih cen. Je natančnejši od aproksimativnega predračuna (±10–15%). Izdela se v fazi PZI. Služi investitorju za planiranje financiranja in primerjavo ponudb izvajalcev.", src: [{ law: "ST ZAPS", art: "02" }] },
      { id: "stzaps-19", q: "Kaj je projektna naloga?", a: "Projektna naloga je dokument, v katerem investitor opredeli zahteve in želje za objekt: namembnost, program prostorov, tehnične zahteve, proračun, roki, posebne zahteve. Je izhodišče za projektiranje. Arhitekt praviloma pomaga investitorju pri pripravi projektne naloge (posebna storitev po ST ZAPS).", src: [{ law: "ST ZAPS", art: "01" }] },
      { id: "stzaps-20", q: "Kaj so normirane ure (NU)?", a: "Normirana ura (NU) je enota za merjenje obsega dela pri projektiranju. Ena NU predstavlja eno uro dela pooblaščenega strokovnjaka. Vrednost NU se določi z dogovorom (tržna cena). Obseg storitev v NU se izračuna po tabelah v ST ZAPS 02 glede na vrsto objekta, zahtevnost in fazo projektiranja.", src: [{ law: "ST ZAPS", art: "02" }] },
      { id: "stzaps-21", q: "Kaj predstavlja vrednost ene NU?", a: "Vrednost ene NU se določi kot urna postavka za delo pooblaščenega arhitekta, ki vključuje: stroške dela, režijske stroške pisarne, zavarovanje, dobiček. ZAPS objavlja priporočeno vrednost NU. Dejanska vrednost je stvar pogajanj med arhitektom in naročnikom.", src: [{ law: "ST ZAPS", art: "02" }] },
      { id: "stzaps-22", q: "Katere stroške se upošteva pri izračunu vrednosti NU?", a: "Pri izračunu vrednosti NU se upoštevajo: (1) bruto plača arhitekta; (2) prispevki delodajalca; (3) režijski stroški pisarne (najem, oprema, programska oprema); (4) zavarovanje poklicne odgovornosti; (5) stalno usposabljanje; (6) dobiček. Skupna vrednost teh stroškov, deljena s produktivnimi urami na leto, da vrednost ene NU.", src: [{ law: "ST ZAPS", art: "02" }] },
      { id: "stzaps-23", q: "Kaj je projektna dokumentacija?", a: "Projektna dokumentacija je celota načrtov, poročil, popisov in drugih dokumentov, ki so podlaga za graditev objekta. Vrste: DGD (za gradbeno dovoljenje), PZI (za izvedbo gradnje), PID (izvedenih del), DZO (dokazilo o zanesljivosti). Vsaka vrsta ima predpisano vsebino po Pravilniku o projektni dokumentaciji.", src: [{ law: "GZ-1", art: "37.–40. člen" }, { law: "ST ZAPS", art: "03" }] },
      { id: "stzaps-24", q: "Kaj je načrt?", a: "Načrt je del projektne dokumentacije, ki ga izdela posamezni pooblaščeni strokovnjak za svoje strokovno področje (arhitekturni načrt, gradbeni načrt, načrt strojnih instalacij, načrt elektroinštalacij ipd.). Vsak načrt ima odgovornega projektanta. Načrt vsebuje: tehnično poročilo, grafične prikaze (tlorisi, prerezi, fasade, detajli), popise del.", src: [{ law: "GZ-1", art: "29. člen" }, { law: "ST ZAPS", art: "03" }] },
      { id: "stzaps-25", q: "Kaj je list — naštej vsebino posameznega lista?", a: "List je posamezna stran grafičnega dela načrta. Vsebina lista: glava lista (ime projekta, investitor, projektant, faza, merilo, datum, številka lista), grafični prikaz (tloris, prerez, fasada, detajl, situacija), legenda oznak, opombe. Formati: A4–A0, digitalno. Merila: situacija 1:500–1:1000, tlorisi/prerezi 1:50–1:100, detajli 1:1–1:20.", src: [{ law: "ST ZAPS", art: "03, 04" }] },
      { id: "stzaps-26", q: "Kaj so gradbeni elementi?", a: "Gradbeni elementi so sestavni deli objekta: temelji, stene (nosilne, predelne), stropne konstrukcije, streha, stopnice, okna, vrata, fasada, tlaki, izolacije, inštalacije. V popisih del se gradbeni elementi razdelijo po skupinah (zemeljska dela, betonska dela, zidarska dela, tesarska dela, krovska dela, kleparska dela, ključavničarska dela, steklarska dela ipd.).", src: [{ law: "ST ZAPS", art: "04" }] },
      { id: "stzaps-27", q: "Razlika med nosilnim in nošenim delom gradbenega elementa?", a: "Nosilni del (konstrukcija): prevzema in prenaša obtežbe na temeljna tla — temelji, nosilne stene, stebri, grede, plošče, ostrešje. Nošeni del (nekonstrukcijski element): ne prenaša obtežb, je pritrjen na konstrukcijo — predelne stene, obloge, inštalacije, stavbno pohištvo. Razlikovanje je bistveno za: statični izračun, požarno varnost, klasifikacijo posegov (rekonstrukcija vs. vzdrževanje).", src: [{ law: "ST ZAPS", art: "04" }, { law: "GZ-1", art: "3. člen" }] },
      { id: "stzaps-28", q: "Razlika med gradbeno (zidarsko), modularno in svetlo (finalno) mero?", a: "Gradbena (zidarska) mera: mera od osi do osi ali od zunanjega roba do zunanjega roba konstrukcije — vključuje debelino sten. Modularna mera: mera, ki temelji na modularnem sistemu (osnovni modul M = 10 cm); usklajena z gradbenimi elementi (opeka, beton). Svetla (finalna) mera: mera med končno obdelanimi površinami (med ometom, med tlaki) — dejanska uporabna dimenzija prostora. Svetla mera = gradbena mera – debelina oblog.", src: [{ law: "ST ZAPS", art: "04" }] },

  // ═══════════════════════════════════════════════════
  // 9. PODZAKONSKI AKTI

  {

    title: "9. Podzakonski akti",

      { id: "podz-3", q: "Katera pravila se uporablja pri izračunavanju velikosti stavb?", a: "Za izračun velikosti stavb se uporablja standard SIST ISO 9836 (površine in prostornine stavb). Ključni pojmi: bruto tlorisna površina (BTP), neto tlorisna površina (NTP), uporabna površina, prostornina. BTP se meri po zunanjem obodu stavbe vključno z zidovi. NTP = BTP – površina konstrukcijskih elementov.", src: [{ law: "GZ-1", art: "Uredba o razvrščanju" }] },
      { id: "podz-4", q: "Katere so značilnosti stavbe — etaže, prostornina, višina, globina?", a: "Etaže: klet (K), pritličje (P), nadstropja (N1, N2...), mansarda (M), podstrešje. Prostornina: bruto prostornina stavbe, izračunana po SIST ISO 9836. Višina: od kote terena do najvišje točke stavbe (sleme, atika). Globina: del stavbe pod nivojem terena (kletne etaže). Etažnost se določa v prostorskih aktih (npr. P+2 pomeni pritličje in dve nadstropji).", src: [{ law: "GZ-1", art: "Uredba o razvrščanju" }] },
      { id: "podz-5", q: "Katere, po zahtevnosti ločene vrste objektov poznamo, kako se ločijo med seboj?", a: "Štiri kategorije: (1) ZAHTEVNI: objekti z velikim vplivom na okolje ali zahtevno konstrukcijo (višji od 30 m, več kot 5000 m² BTP, javna infrastruktura); (2) MANJ ZAHTEVNI: praviloma stanovanjske stavbe do P+2, poslovne stavbe srednje velikosti; (3) NEZAHTEVNI: majhni objekti (garaže do 50 m², lope, nadstreški); (4) ENOSTAVNI: najmanjši objekti (ograje, škarpe do 1,5 m, urbana oprema).", src: [{ law: "GZ-1", art: "5. člen, Uredba o razvrščanju" }] },
      { id: "podz-6", q: "Kako se klasificira objekte, kadar gre za sestavljen oz. večnamenski objekt?", a: "Sestavljen objekt se klasificira po prevladujoči rabi (namembnosti, ki zavzema največji del BTP). Večnamenski objekt: če nobena raba ne presega 50%, se klasificira v kategorijo z najzahtevnejšimi pogoji. Pri razvrščanju po zahtevnosti: odločilni so najzahtevnejši parametri (npr. če en del presega merila za manj zahtevne, je celoten objekt razvrščen kot zahteven).", src: [{ law: "GZ-1", art: "Uredba o razvrščanju" }] },
      { id: "podz-7", q: "Kaj je vzdrževanje; kaj so vzdrževalna dela; katere so vrste vzdrževalnih del na stavbah?", a: "Vzdrževanje: izvedba del za ohranitev objekta v stanju, ki zagotavlja uporabnost. Vrste vzdrževalnih del: (1) redna vzdrževalna dela (pleskanje, popravila); (2) investicijska vzdrževalna dela (zamenjava strehe, fasade, oken — brez posega v konstrukcijo); (3) vzdrževalna dela v javno korist (na infrastrukturi). Za vzdrževalna dela ni potrebno GD (razen če pomenijo rekonstrukcijo).", src: [{ law: "GZ-1", art: "3., 7. člen" }] },
      { id: "podz-8", q: "Kaj je objekt kot proizvod; pod kakšnimi pogoji je proizvod lahko nezahteven objekt?", a: "Objekt kot proizvod je prefabriciran objekt (kontejner, modularna stavba), ki se kot celota postavi na lokacijo. Pogoji za nezahtevni objekt: mora ustrezati merilom za nezahtevne objekte (površina, višina, namembnost). Če presega merila → manj zahtevni ali zahtevni objekt → potrebno GD.", src: [{ law: "GZ-1", art: "Uredba o razvrščanju" }] },
      { id: "podz-9", q: "Kaj je manjša rekonstrukcija, katera dela so dovoljena na obodu in izven objekta, pod kakšnimi pogoji?", a: "Manjša rekonstrukcija: sprememba, pri kateri se ne posega v nosilno konstrukcijo in ne spreminja zunanjega videza. Dovoljena dela: zamenjava oken (enake velikosti), zamenjava vrat, notranje predelave (predelne stene), zamenjava instalacij, zamenjava tlakov. Pogoj: dela ne smejo vplivati na izpolnjevanje bistvenih zahtev in morajo biti skladna s prostorskimi akti.", src: [{ law: "GZ-1", art: "3., 8. člen" }] },
      { id: "podz-10", q: "Kaj so začasni objekti, kakšni so splošni pogoji za začasne objekte?", a: "Začasni objekti: objekti, namenjeni začasni uporabi za omejen čas (npr. gradbišča, prireditveni šotori, sezonski objekti). Pogoji: morajo biti odstranjeni po preteku roka; ne smejo trajno spreminjati prostora; za nekatere je potrebno GD z omejenim rokom veljavnosti; morajo izpolnjevati bistvene zahteve za čas uporabe.", src: [{ law: "GZ-1", art: "9. člen" }] },
      { id: "podz-11", q: "Katere vrste dokumentacije obravnava Pravilnik o projektni in drugi dokumentaciji?", a: "Pravilnik (UL RS 30/23) obravnava: (1) DGD — dokumentacija za gradbeno dovoljenje; (2) PZI — projektna dokumentacija za izvedbo gradnje; (3) PID — projektna dokumentacija izvedenih del; (4) DZO — dokazilo o zanesljivosti objekta. Vsaka vrsta ima predpisano vsebino: vodilna mapa, načrti, elaborati, popisi, tehnična poročila.", src: [{ law: "GZ-1", art: "37.–40. člen" }] },
      { id: "podz-12", q: "Katere so projektne DGD za različne vrste gradenj (novogradnja, rekonstrukcija, prizidava)?", a: "Za vsako vrsto gradnje DGD vsebuje: (1) VODILNA MAPA: splošni podatki, izjava odgovornega projektanta, grafični prikaz lokacije; (2) NAČRTI: arhitekturni, gradbeni, instalacijski (obseg odvisen od zahtevnosti); (3) ELABORATI: geodetski, požarne varnosti, energetske učinkovitosti. Za novogradnjo: popolna DGD. Za rekonstrukcijo: prikaz obstoječega in predvidenega stanja. Za prizidavo: vključno z obstoječim objektom.", src: [{ law: "GZ-1", art: "37.–40. člen, Pravilnik o PD" }] },
      { id: "podz-13", q: "Kaj je ime in vsebina projektne dokumentacije izvedenih del — PID?", a: "PID (projektna dokumentacija izvedenih del) dokumentira dejanski izvedeni objekt. Izdela se po zaključku gradnje, pred pridobitvijo uporabnega dovoljenja. Vsebuje: prikaz dejanskega stanja (tlorisi, prerezi, fasade), spremembe glede na PZI, podatke za vpis v kataster. Odgovorni projektant izjavi, da je objekt zgrajen skladno z GD oz. da so odstopanja v okviru dopustnih.", src: [{ law: "GZ-1", art: "39. člen, Pravilnik o PD" }] },
      { id: "podz-14", q: "Kaj je ime in vsebina dokazila o zanesljivosti objekta — DZO?", a: "DZO (dokazilo o zanesljivosti objekta) je dokument, ki dokazuje, da objekt izpolnjuje bistvene zahteve. Vsebuje: izjave odgovornih oseb (projektant, nadzornik, izvajalec), potrdila o kakovosti vgrajenih materialov, merilne rezultate (zvočna izolacija, energetska učinkovitost), geodetski načrt. DZO je pogoj za pridobitev uporabnega dovoljenja.", src: [{ law: "GZ-1", art: "40. člen, Pravilnik o PD" }] },
    ],
  },
];

function SourceBadge({ s }) {
  const url = s.law && PISRS[s.law] ? PISRS[s.law] : null;
  return (
    <span className="inline-flex items-center gap-1 text-xs rounded-full px-2 py-0.5 font-medium"
      style={{ background: "#e0f2fe", color: "#0369a1" }}>
      {url ? (
        <a href={url} target="_blank" rel="noopener noreferrer"
          className="underline hover:no-underline" style={{ color: "#0369a1" }}>
          {s.law}, {s.art}
        </a>
      ) : (
        <span>{s.law ? `${s.law}, ${s.art}` : s.art}</span>
      )}
    </span>
  );
}

function QuestionCard({ item, sectionColor, learned, toggleLearned, editedAnswer, setEditedAnswer }) {
  const [open, setOpen] = useState(false);
  const [editing, setEditing] = useState(false);
  const displayAnswer = editedAnswer ?? item.a;

  return (
    <div className="border rounded-lg mb-3 overflow-hidden transition-shadow hover:shadow-md"
      style={{ borderLeftWidth: 4, borderLeftColor: sectionColor }}>
      <button
        className="w-full text-left px-4 py-3 flex items-start gap-3"
        style={{ background: learned ? "#f0fdf4" : "#fff" }}
        onClick={() => setOpen(o => !o)}>
        <span className="mt-0.5 text-lg select-none">{open ? "▾" : "▸"}</span>
        <span className="flex-1 font-medium text-gray-800 text-sm leading-relaxed">{item.q}</span>
        <span className="shrink-0 cursor-pointer text-lg" title={learned ? "Označeno kot naučeno" : "Označi kot naučeno"}
          onClick={e => { e.stopPropagation(); toggleLearned(); }}>
          {learned ? "✅" : "⬜"}
        </span>
      </button>
      {open && (
        <div className="px-4 pb-4 border-t" style={{ background: "#fafbfc" }}>
          {editing ? (
            <textarea
              className="w-full mt-3 p-3 rounded border text-sm leading-relaxed font-normal"
              style={{ minHeight: 160 }}
              value={displayAnswer}
              onChange={e => setEditedAnswer(e.target.value)}
            />
          ) : (
            <p className="mt-3 text-sm text-gray-700 leading-relaxed whitespace-pre-line">{displayAnswer}</p>
          )}
          <div className="mt-3 flex flex-wrap items-center gap-2">
            <span className="text-xs font-semibold text-gray-500 mr-1">VIRI:</span>
            {item.src.map((s, i) => <SourceBadge key={i} s={s} />)}
            <button
              className="ml-auto text-xs px-2 py-1 rounded border"
              style={{ color: "#6b7280" }}
              onClick={() => setEditing(e => !e)}>
              {editing ? "Shrani" : "Uredi"}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function ProgressBar({ learned, total }) {
  const pct = total === 0 ? 0 : Math.round((learned / total) * 100);
  return (
    <div className="flex items-center gap-2 text-xs text-gray-500 mt-1">
      <div className="flex-1 h-1.5 rounded-full bg-gray-200 overflow-hidden">
        <div className="h-full rounded-full transition-all" style={{ width: `${pct}%`, background: "#22c55e" }} />
      </div>
      <span>{learned}/{total}</span>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════
   MAIN APP
   ════════════════════════════════════════════════════════════════════ */

function App() {
  const [activeSection, setActiveSection] = useState(SECTIONS[0].id);
  const [search, setSearch] = useState("");
  const [learnedMap, setLearnedMap] = useState({});
  const [editedAnswers, setEditedAnswers] = useState({});
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [showAll, setShowAll] = useState(false);

  const toggleLearned = useCallback((qId) => {
    setLearnedMap(prev => ({ ...prev, [qId]: !prev[qId] }));
  }, []);

  const setEditedAnswer = useCallback((qId, val) => {
    setEditedAnswers(prev => ({ ...prev, [qId]: val }));
  }, []);

  // Filter
  const filteredSections = useMemo(() => {
    if (!search.trim()) return SECTIONS;
    const s = search.toLowerCase();
    return SECTIONS.map(sec => ({
      ...sec,
      questions: sec.questions.filter(q =>
        q.q.toLowerCase().includes(s) || q.a.toLowerCase().includes(s)
      ),
    })).filter(sec => sec.questions.length > 0);
  }, [search]);

  const currentSection = showAll
    ? null
    : filteredSections.find(s => s.id === activeSection) || filteredSections[0];

  const displaySections = showAll ? filteredSections : (currentSection ? [currentSection] : []);

  // Stats
  const totalQ = SECTIONS.reduce((n, s) => n + s.questions.length, 0);
  const totalLearned = Object.values(learnedMap).filter(Boolean).length;

  // Export
  const handleExport = () => {
    let md = "# Strokovni izpit PA — Splošni del\n\n";
    SECTIONS.forEach(sec => {
      md += `## ${sec.title}\n\n`;
      sec.questions.forEach(q => {
        const ans = editedAnswers[q.id] ?? q.a;
        md += `### ${q.q}\n\n${ans}\n\n`;
        md += `**Viri:** ${q.src.map(s => `${s.law || ""} ${s.art}`).join("; ")}\n\n---\n\n`;
      });
    });
    const blob = new Blob([md], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "izpitna-vprasanja-splosni-del.md"; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="flex h-screen bg-gray-50" style={{ fontFamily: "'Inter', 'Segoe UI', system-ui, sans-serif" }}>
      {/* ── SIDEBAR ── */}
      {sidebarOpen && (
        <aside className="w-72 shrink-0 bg-white border-r flex flex-col overflow-hidden">
          <div className="p-4 border-b">
            <h1 className="text-base font-bold text-gray-900">Strokovni izpit PA</h1>
            <p className="text-xs text-gray-500 mt-0.5">Splošni del · ZAPS 2026</p>
            <ProgressBar learned={totalLearned} total={totalQ} />
          </div>
          <nav className="flex-1 overflow-y-auto p-2">
            <button
              className={`w-full text-left px-3 py-2 rounded text-sm mb-1 ${showAll ? "bg-gray-100 font-semibold" : "hover:bg-gray-50"}`}
              onClick={() => { setShowAll(true); }}>
              📚 Vsa vprašanja
            </button>
            {SECTIONS.map(sec => {
              const secLearned = sec.questions.filter(q => learnedMap[q.id]).length;
              const active = !showAll && activeSection === sec.id;
              return (
                <button key={sec.id}
                  className={`w-full text-left px-3 py-2 rounded text-sm mb-1 transition-colors ${active ? "font-semibold" : "hover:bg-gray-50"}`}
                  style={active ? { background: sec.color + "15", color: sec.color } : {}}
                  onClick={() => { setActiveSection(sec.id); setShowAll(false); }}>
                  <span className="mr-1.5">{sec.icon}</span>
                  <span>{sec.title.replace(/^\d+\.\s*/, "")}</span>
                  <span className="block text-xs mt-0.5" style={{ color: "#9ca3af" }}>
                    {secLearned}/{sec.questions.length} naučeno
                  </span>
                </button>
              );
            })}
          </nav>
          <div className="p-3 border-t">
            <button onClick={handleExport}
              className="w-full text-xs px-3 py-2 rounded border text-gray-600 hover:bg-gray-50">
              Izvozi kot Markdown
            </button>
          </div>
        </aside>
      )}

      {/* ── MAIN ── */}
      <main className="flex-1 flex flex-col overflow-hidden">
        {/* Toolbar */}
        <div className="shrink-0 bg-white border-b px-4 py-3 flex items-center gap-3">
          <button onClick={() => setSidebarOpen(o => !o)}
            className="text-gray-500 hover:text-gray-800 text-lg" title="Preklopi stranski meni">
            ☰
          </button>
          <input
            type="text"
            placeholder="Išči po vprašanjih in odgovorih..."
            className="flex-1 px-3 py-1.5 rounded-lg border text-sm"
            style={{ maxWidth: 500 }}
            value={search}
            onChange={e => setSearch(e.target.value)}
          />
          <span className="text-xs text-gray-400 whitespace-nowrap">
            {totalLearned}/{totalQ} naučeno ({totalQ > 0 ? Math.round(totalLearned / totalQ * 100) : 0}%)
          </span>
        </div>

        {/* Content */}
        <div className="flex-1 overflow-y-auto p-4 md:p-6">
          {displaySections.length === 0 && (
            <p className="text-center text-gray-400 mt-12">Ni zadetkov za »{search}«</p>
          )}
          {displaySections.map(sec => (
            <div key={sec.id} className="mb-8">
              <div className="mb-4">
                <h2 className="text-lg font-bold" style={{ color: sec.color }}>
                  {sec.icon} {sec.title}
                </h2>
                {sec.subtitle && <p className="text-xs text-gray-500 mt-0.5">{sec.subtitle}</p>}
                <ProgressBar
                  learned={sec.questions.filter(q => learnedMap[q.id]).length}
                  total={sec.questions.length}
                />
              </div>
              {sec.questions.map(q => (
                <QuestionCard
                  key={q.id}
                  item={q}
                  sectionColor={sec.color}
                  learned={!!learnedMap[q.id]}
                  toggleLearned={() => toggleLearned(q.id)}
                  editedAnswer={editedAnswers[q.id]}
                  setEditedAnswer={(val) => setEditedAnswer(q.id, val)}
                />
              ))}
            </div>
          ))}
        </div>
      </main>
    </div>
  );
}


// Override App to use localStorage persistence
const OrigApp = App;

function PersistentApp() {
  const [activeSection, setActiveSection] = useState(() => loadState("section", SECTIONS[0].id));
  const [search, setSearch] = useState("");
  const [learnedMap, setLearnedMap] = useState(() => loadState("learned", {}));
  const [editedAnswers, setEditedAnswers] = useState(() => loadState("edits", {}));
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [showAll, setShowAll] = useState(false);

  // Persist on change
  useEffect(() => { saveState("learned", learnedMap); }, [learnedMap]);
  useEffect(() => { saveState("edits", editedAnswers); }, [editedAnswers]);
  useEffect(() => { saveState("section", activeSection); }, [activeSection]);

  const toggleLearned = useCallback((qId) => {
    setLearnedMap(prev => ({ ...prev, [qId]: !prev[qId] }));
  }, []);

  const setEditedAnswer = useCallback((qId, val) => {
    setEditedAnswers(prev => ({ ...prev, [qId]: val }));
  }, []);

  const filteredSections = useMemo(() => {
    if (!search.trim()) return SECTIONS;
    const s = search.toLowerCase();
    return SECTIONS.map(sec => ({
      ...sec,
      questions: sec.questions.filter(q =>
        q.q.toLowerCase().includes(s) || q.a.toLowerCase().includes(s)
      ),
    })).filter(sec => sec.questions.length > 0);
  }, [search]);

  const currentSection = showAll ? null : filteredSections.find(s => s.id === activeSection) || filteredSections[0];
  const displaySections = showAll ? filteredSections : (currentSection ? [currentSection] : []);

  const totalQ = SECTIONS.reduce((n, s) => n + s.questions.length, 0);
  const totalLearned = Object.values(learnedMap).filter(Boolean).length;

  const handleExport = () => {
    let md = "# Strokovni izpit PA — Splošni del\n\n";
    SECTIONS.forEach(sec => {
      md += `## ${sec.title}\n\n`;
      sec.questions.forEach(q => {
        const ans = editedAnswers[q.id] ?? q.a;
        md += `### ${q.q}\n\n${ans}\n\n`;
        md += `**Viri:** ${q.src.map(s => `${s.law || ""} ${s.art}`).join("; ")}\n\n---\n\n`;
      });
    });
    const blob = new Blob([md], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "izpitna-vprasanja-splosni-del.md"; a.click();
    URL.revokeObjectURL(url);
  };

  return React.createElement("div", { className: "app" },
    // Overlay
    React.createElement("div", {
      className: "overlay" + (sidebarOpen ? " visible" : ""),
      onClick: () => setSidebarOpen(false)
    }),
    // Sidebar
    React.createElement("aside", { className: "sidebar" + (sidebarOpen ? " open" : "") },
      React.createElement("div", { className: "sidebar-head" },
        React.createElement("h1", null, "Strokovni izpit PA"),
        React.createElement("p", null, "Splošni del · ZAPS 2026"),
        React.createElement(ProgressBar, { learned: totalLearned, total: totalQ })
      ),
      React.createElement("nav", { className: "sidebar-nav" },
        React.createElement("button", {
          className: "nav-item" + (showAll ? " active" : ""),
          style: showAll ? { background: "#f1f5f9" } : {},
          onClick: () => { setShowAll(true); setSidebarOpen(false); }
        }, "📚 Vsa vprašanja"),
        SECTIONS.map(sec => {
          const secLearned = sec.questions.filter(q => learnedMap[q.id]).length;
          const active = !showAll && activeSection === sec.id;
          return React.createElement("button", {
            key: sec.id,
            className: "nav-item" + (active ? " active" : ""),
            style: active ? { background: sec.color + "12", color: sec.color, borderLeft: "3px solid " + sec.color } : {},
            onClick: () => { setActiveSection(sec.id); setShowAll(false); setSidebarOpen(false); }
          },
            React.createElement("span", null, sec.icon + " " + sec.title.replace(/^\d+\.\s*/, "")),
            React.createElement("span", { className: "nav-sub" }, secLearned + "/" + sec.questions.length + " naučeno")
          );
        })
      ),
      React.createElement("div", { className: "sidebar-foot" },
        React.createElement("button", { className: "export-btn", onClick: handleExport }, "📥 Izvozi kot Markdown")
      )
    ),
    // Main
    React.createElement("main", { className: "main" },
      // Toolbar
      React.createElement("div", { className: "toolbar" },
        React.createElement("button", { className: "menu-btn", onClick: () => setSidebarOpen(o => !o) }, "☰"),
        React.createElement("input", {
          className: "search-input",
          type: "text",
          placeholder: "Išči po vprašanjih...",
          value: search,
          onChange: e => setSearch(e.target.value)
        }),
        React.createElement("span", { className: "stats" }, totalLearned + "/" + totalQ + " (" + (totalQ > 0 ? Math.round(totalLearned / totalQ * 100) : 0) + "%)")
      ),
      // Content
      React.createElement("div", { className: "content" },
        displaySections.length === 0 && React.createElement("p", { className: "empty" }, "Ni zadetkov za »" + search + "«"),
        displaySections.map(sec => React.createElement("div", { key: sec.id, style: { marginBottom: 32 } },
          React.createElement("div", { className: "section-header" },
            React.createElement("h2", { className: "section-title", style: { color: sec.color } }, sec.icon + " " + sec.title),
            sec.subtitle && React.createElement("p", { className: "section-sub" }, sec.subtitle),
            React.createElement(ProgressBar, { learned: sec.questions.filter(q => learnedMap[q.id]).length, total: sec.questions.length })
          ),
          sec.questions.map(q => React.createElement(QuestionCard, {
            key: q.id, item: q, sectionColor: sec.color,
            learned: !!learnedMap[q.id],
            toggleLearned: () => toggleLearned(q.id),
            editedAnswer: editedAnswers[q.id],
            setEditedAnswer: val => setEditedAnswer(q.id, val)
          }))
        ))
      )
    )
  );
}

// Override SourceBadge and QuestionCard to use createElement instead of JSX
// (Babel handles JSX in the original definitions, so they work as-is)

ReactDOM.render(React.createElement(PersistentApp), document.getElementById("root"));
</script>
</body>
</html>
